<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Спрайтодел</title>
<style>
:root{--pl:#cbc6b8;--pl2:#b3ae9d;--pl3:#e6e2d6;--ink:#1c1e1a;--scr:#14181b;--lcd:#6b7d72;--acc:#b0301d;--yel:#e8b923;--grn:#2c8a4b;--blu:#2d68ad;--tx:#e9efdc;--dim:#d3dcc6}
*{box-sizing:border-box}
html{background:#8f8a7c}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Bahnschrift,"Segoe UI",Consolas,sans-serif;background:
 repeating-linear-gradient(0deg,rgba(0,0,0,.035) 0 2px,transparent 2px 4px),#9c978a;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--blu);outline-offset:2px}
.px{display:inline-block;vertical-align:middle;background:currentColor;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:100% 100%;mask-size:100% 100%;image-rendering:pixelated;flex:none}
.pp{display:block}.pp .ln{display:block;margin-bottom:6px}.pp .ln:last-child{margin-bottom:0}
.back{position:absolute;left:12px;top:6px;font-size:14px;font-weight:600;color:#0d0f0c;text-decoration:none;padding:3px 6px;border-radius:3px;background:rgba(255,255,255,.7);line-height:18px;z-index:5}
.back:hover{background:#fff}
#app{max-width:1760px;margin:0 auto;padding:30px 14px 18px}
.top{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:12px}
.ttl{margin:0;position:relative;display:inline-block;font-size:0;line-height:0;padding:0 4px 4px 0;color:var(--acc)}
.ttl .sh{position:absolute;left:4px;top:4px;color:var(--ink)}
.ttl .mn{position:relative}
.sub{color:#14171a}
.hud{margin-left:auto;display:flex;gap:8px;align-items:center}
.led{width:14px;height:14px;border-radius:50%;background:#ef3b2b;box-shadow:0 0 0 2px var(--ink),0 0 10px #ef3b2b;margin-right:4px}
.pbtn{min-height:36px;min-width:36px;padding:0 12px;background:var(--pl3);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);border-radius:3px;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--ink)}
.pbtn:hover{background:#fff}
.pbtn:active,.pbtn.on{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.pbtn.on{background:var(--acc);color:#fff}
.pbtn.go{background:var(--grn);color:#fff}.pbtn.go:hover{background:#37a05a}
.pbtn.warn{background:var(--yel)}.pbtn.warn:hover{background:#f4cd48}
.pbtn[disabled]{opacity:.5;cursor:default}
.grid{display:grid;grid-template-columns:292px minmax(0,1fr) 440px;gap:16px;align-items:start}
.panel{background:var(--pl);border:3px solid var(--ink);border-radius:12px;padding:12px;box-shadow:inset 0 0 0 3px var(--pl3),0 5px 0 rgba(0,0,0,.35)}
.lab{display:block;margin:12px 0 5px;color:#0b0d09}
.lab:first-child{margin-top:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .pbtn{flex:1 1 auto;padding:0 10px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg2 .pbtn{padding:0 4px;flex-direction:column;gap:3px;justify-content:center;min-height:42px}
.seg2 .pbtn.wide{grid-column:1/3}
.strip{display:block;width:100%;height:6px;border:1px solid var(--ink)}
.seed{display:flex;gap:6px}
#seedIn{flex:1;min-width:0;height:40px;border:2px solid var(--ink);background:#f4f1e6;font:700 18px Consolas,"Courier New",monospace;padding:0 8px;text-transform:uppercase;color:var(--ink);border-radius:3px;box-shadow:inset 0 2px 0 rgba(0,0,0,.18)}
.mid{display:grid;gap:14px;min-width:0}
.catbar{display:grid;grid-template-columns:repeat(7,auto);gap:4px;justify-content:stretch}
.catbar .pbtn{padding:0 2px;min-width:0}
.screen{position:relative;background:var(--scr);border:3px solid var(--ink);border-radius:16px;padding:10px;box-shadow:inset 0 0 0 3px #3b413a,0 5px 0 rgba(0,0,0,.35);color:var(--tx)}
.screen:after{content:"";position:absolute;inset:0;border-radius:13px;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 8px;color:var(--dim);flex-wrap:wrap;min-height:20px}
.shead b{color:var(--tx)}
#sheet{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.cell{position:relative;aspect-ratio:1;padding:0;border:2px solid #3b463f;background:var(--lcd);display:flex;align-items:center;justify-content:center;border-radius:3px;min-width:0;overflow:hidden;padding:2px}
.cell:hover{border-color:#e9efdc}
.cell.sel{border-color:var(--yel);box-shadow:0 0 0 2px var(--yel);z-index:2}
.cell.isb{border-color:#6ec1ff;box-shadow:0 0 0 2px #6ec1ff;z-index:2}
.cell canvas,.mut canvas{image-rendering:pixelated;display:block;width:100%;height:100%}
.badge{position:absolute;right:2px;top:2px;width:16px;height:16px;background:#6ec1ff;color:#0b1a28;display:flex;align-items:center;justify-content:center;font:700 12px Consolas,monospace}
#muts{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.mut{aspect-ratio:1;border:2px solid #3b463f;background:var(--lcd);padding:3px;display:flex;align-items:center;justify-content:center;border-radius:3px;min-width:0;overflow:hidden}
.mut:hover{border-color:var(--yel)}
.tabs{display:flex;gap:4px;margin-bottom:-3px;position:relative;z-index:2;padding:0 10px}
.tab{flex:1;min-height:40px;border:3px solid var(--ink);border-bottom:0;border-radius:10px 10px 0 0;background:#e6e2d6;padding:0 4px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.tab:hover{background:var(--pl3)}
.tab.on{background:var(--scr);color:var(--yel)}
#tabBody{border-radius:16px;min-height:640px}
.stagewrap{display:flex;gap:10px;align-items:flex-start}
#stage,#ed{image-rendering:pixelated;display:block;border:2px solid #3b463f;background:#222;max-width:100%;padding:0}
#stage{margin:6px 0}
.vtools{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.tbtn{min-height:36px;border:2px solid #7d8c7f;background:#2a352f;color:#f4f8ea;border-radius:3px;display:flex;align-items:center;justify-content:center;padding:0 6px;gap:6px}
.tbtn:hover{border-color:var(--tx)}
.tbtn.on{background:var(--yel);color:#161400;border-color:var(--yel)}
.tbtn.go{background:var(--grn);color:#fff;border-color:#7fd69d}
.tbtn.go:hover{background:#37a05a}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.row .tbtn{flex:1 1 auto}
.card{margin-top:12px;border:2px solid #4d5a50;border-radius:6px;padding:12px 16px;background:#1b2220;position:relative;z-index:1}
.card .nm{color:var(--tx)}
.card .ep{color:var(--dim);margin-top:5px}
.card .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.pips{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}.pips i{width:9px;height:9px;background:currentColor;display:block}.pips i.off{opacity:.25}
.cost{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;background:var(--blu);color:#fff;border:2px solid #9bc6f2;padding:0 4px}
.stats{display:grid;gap:4px;margin-top:10px}
.st{display:flex;align-items:center;gap:8px}
.st .lbl{width:34px;color:var(--dim)}
.bar{display:flex;gap:2px}.bar i{width:14px;height:12px;background:#33403a;display:block}.bar i.f{background:var(--c)}
.abil{margin-top:10px;padding-top:8px;border-top:2px dashed #4d5a50;color:var(--tx)}
.abil .t{color:var(--yel);margin-bottom:4px}
.fl{margin-top:8px;color:var(--dim)}
.hint{color:var(--dim);margin-top:8px}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(28px,1fr));gap:3px;margin-top:8px;max-height:134px;overflow:auto;padding:2px}
.sw button{height:28px;border:2px solid #0b0d0c;padding:0;border-radius:2px}
.sw button.on{outline:3px solid var(--yel);outline-offset:1px;z-index:1}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
.three figure{margin:0;text-align:center}.three figcaption{margin-top:5px;color:var(--dim)}
.three canvas{image-rendering:pixelated;width:100%;max-width:120px;aspect-ratio:1;background:var(--lcd);border:2px solid #3b463f}
input[type=range]{width:100%;height:36px;accent-color:var(--yel)}
.msg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border:2px solid var(--yel);border-radius:4px;z-index:50;pointer-events:none;opacity:0;transition:opacity .2s}
.msg.on{opacity:1}
#help{position:fixed;inset:0;background:rgba(10,12,10,.78);z-index:60;display:none;align-items:center;justify-content:center;padding:14px}
#help.on{display:flex}
#help .box{background:var(--pl);border:3px solid var(--ink);border-radius:12px;padding:18px 20px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
#help .kr{display:flex;gap:12px;align-items:center;margin:7px 0}
#help kbd{min-width:62px;text-align:center;font:700 14px Consolas,monospace;background:#fff;border:2px solid var(--ink);border-radius:3px;padding:3px 6px;box-shadow:0 2px 0 var(--ink)}
.flash{animation:fl .5s steps(4)}
@keyframes fl{0%{filter:invert(1)}50%{filter:none}100%{filter:invert(0)}}
.foot{margin-top:12px;color:#1f2219;display:flex;gap:14px;flex-wrap:wrap}
@media (max-width:1280px){.grid{grid-template-columns:270px minmax(0,1fr) 400px}}
@media (max-width:1100px){.grid{grid-template-columns:minmax(0,1fr)}.mid{order:1}#right{order:2}#ctl{order:3}#tabBody{min-height:0}.hud{margin-left:0}}
@media (max-width:760px){.catbar{grid-template-columns:repeat(4,1fr)}}
@media (max-width:620px){#app{padding:34px 8px 14px}#sheet{grid-template-columns:repeat(5,1fr)}#muts{grid-template-columns:repeat(4,1fr)}.stagewrap{flex-direction:column}.tab{padding:0 2px}.panel{padding:10px}.screen{padding:8px}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}

<body>
<a class="back" href="../index.html">← Все приложения</a>
<div id="app">
<header class="top">
 <h1 class="ttl" aria-label="Спрайтодел"><span class="px sh" data-s="5" data-t="СПРАЙТОДЕЛ"></span><span class="px mn" data-s="5" data-t="СПРАЙТОДЕЛ"></span></h1>
 <span class="px sub" data-s="2" data-t="ФАБРИКА ПИКСЕЛЬНЫХ СУЩЕСТВ"></span>
 <div class="hud"><span class="led" id="led" title="Питание"></span>
  <button class="pbtn" id="bHelp" aria-label="Подсказки по клавишам"><span class="px" data-s="2" data-t="КЛАВИШИ ?"></span></button>
  <button class="pbtn warn" id="bReset" aria-label="Сбросить всё"><span class="px" data-s="2" data-t="СБРОС"></span></button></div>
</header>
<main class="grid">
 <section id="ctl" class="panel" aria-label="Настройки генератора"></section>
 <section class="mid" id="mid">
  <div class="catbar" id="cats" role="group" aria-label="Что рисовать"></div>
  <div class="screen"><div class="shead" id="sheadA"></div><div id="sheet" role="group" aria-label="Лист спрайтов"></div></div>
  <div class="screen"><div class="shead" id="sheadB"></div><div id="muts" role="group" aria-label="Мутанты"></div></div>
 </section>
 <section id="right"><div class="tabs" id="tabs" role="tablist"></div><div class="screen" id="tabBody"></div></section>
</main>
</div>
<div id="help" role="dialog" aria-modal="true" aria-label="Клавиши"><div class="box" id="helpBox"></div></div>
<div class="msg" id="msg" role="status"></div>

const FONT_UP = { 'Й': '.###.', 'Ё': '.#.#.' };
const FONT_DN = { 'Ц': '....#', 'Щ': '....#', ',': '#', ';': '#' };
const GLYPHS = {};
FONT_SRC.split('\n').forEach(line => {
  if (!line.trim()) return;
  const ch = line[0];
  const rows = line.slice(2).split('/');
  GLYPHS[ch] = { rows, w: rows[0].length, up: FONT_UP[ch] || null, dn: FONT_DN[ch] || null };
});
GLYPHS[' '] = { rows: null, w: 3 };
function glyphOf(ch) {
  ch = ch.toUpperCase();
  if (ch === 'Ё') ch = 'Ё';
  return GLYPHS[ch] || GLYPHS['?'];
}
/* Возвращает {w,h,cells:[[x,y],...]} в клетках шрифта */
const _tmCache = new Map();
function textCells(str) {
  if (_tmCache.has(str)) return _tmCache.get(str);
  let hasUp = false, hasDn = false;
  for (const ch of str) { const g = glyphOf(ch); if (g.up) hasUp = true; if (g.dn) hasDn = true; }
  const top = 1;
  const cells = [];
  let x = 0;
  for (const ch of str) {
    const g = glyphOf(ch);
    if (g.rows) {
      g.rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) if (r[i] === '#') cells.push([x + i, top + j]); });
      if (g.up) for (let i = 0; i < g.up.length; i++) if (g.up[i] === '#') cells.push([x + i, 0]);
      if (g.dn) for (let i = 0; i < g.dn.length; i++) if (g.dn[i] === '#') cells.push([x + i, top + 7]);
    }
    x += g.w + 1;
  }
  const res = { w: Math.max(1, x - 1), h: 9, cells };
  _tmCache.set(str, res);
  return res;
}

/* ===== утилиты ===== */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function hashStr(s) { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; }
function mix(a, b) { let h = (a ^ Math.imul((b | 0) + 0x7f4a7c15, 0x9E3779B1)) >>> 0; h = Math.imul(h ^ (h >>> 15), 0x85EBCA6B) >>> 0; h = Math.imul(h ^ (h >>> 13), 0xC2B2AE35) >>> 0; return (h ^ (h >>> 16)) >>> 0; }
function RNG(seed) {
  let a = seed >>> 0;
  const f = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  f.int = n => Math.floor(f() * n);
  f.range = (x, y) => x + f() * (y - x);
  f.irange = (x, y) => x + Math.floor(f() * (y - x + 1));
  f.pick = arr => arr[Math.floor(f() * arr.length)];
  f.chance = p => f() < p;
